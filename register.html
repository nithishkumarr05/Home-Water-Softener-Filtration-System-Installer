<!DOCTYPE html>
<html lang="en" dir="ltr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, height=device-height, viewport-fit=cover">
    <title>Create Account · AquaPure &middot; Water Softener &amp; Filtration Systems</title>
    <link rel="icon" href="assets/images/favicon.png" type="image/png">
    <meta name="description" content="Create your AquaPure account. Book water softener installations, filtration systems, and water testing services.">

    <script src="tailwind.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'aqua': '#1B8A9E',
                        'aqua-dark': '#0F6B7A',
                        'aqua-light': '#A8DDE8',
                        'aqua-glow': '#D4F0F7',
                        'mist': '#F0F9FC',
                        'canvas-light': '#F5FBFD',
                        'canvas-dark': '#0F1A1F',
                        'deep': '#0A2A33',
                    },
                    fontFamily: {
                        'sans': ['Inter', 'system-ui', 'sans-serif'],
                        'display': ['Poppins', 'sans-serif'],
                        'mono': ['Space Mono', 'monospace'],
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.5s ease-out',
                        'float': 'float 8s ease-in-out infinite',
                    },
                    keyframes: {
                        fadeIn: { '0%': { opacity: '0', transform: 'translateY(12px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
                        float: { '0%, 100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-10px)' } },
                    }
                }
            }
        }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        html, body { min-height: 100%; margin: 0; padding: 0; }
        body {
            background-color: #F5FBFD;
            color: #0A2A33;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100dvh;
            font-family: 'Inter', sans-serif;
            background-image:
                radial-gradient(circle at 15% 20%, rgba(27,138,158,0.12) 0%, transparent 55%),
                radial-gradient(circle at 85% 80%, rgba(168,221,232,0.20) 0%, transparent 55%),
                linear-gradient(135deg, #F5FBFD 0%, #E8F4F8 50%, #D4EDF5 100%);
            padding: 1rem;
            box-sizing: border-box;
        }
        .dark body {
            background-color: #071012;
            color: #F0F9FC;
            background-image:
                radial-gradient(circle at 15% 20%, rgba(27,138,158,0.18) 0%, transparent 55%),
                radial-gradient(circle at 85% 80%, rgba(168,221,232,0.10) 0%, transparent 55%),
                linear-gradient(135deg, #0F1A1F 0%, #0A1418 50%, #071012 100%);
        }

        /* Floating bubbles */
        .bubble {
            position: fixed;
            border-radius: 9999px;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.6), rgba(168,221,232,0.15));
            border: 1px solid rgba(27,138,158,0.2);
            pointer-events: none;
            animation: float 8s ease-in-out infinite;
            z-index: 0;
        }
        .dark .bubble {
            background: radial-gradient(circle at 30% 30%, rgba(168,221,232,0.15), rgba(27,138,158,0.05));
            border-color: rgba(27,138,158,0.3);
        }

        /* toggles */
        .theme-toggle-wrapper {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 1000;
            display: flex;
            gap: 8px;
        }
        [dir="rtl"] .theme-toggle-wrapper { right: auto; left: 16px; }
        .toggle-btn {
            width: 40px; height: 40px;
            border-radius: 40px;
            background: rgba(255,255,255,0.9);
            color: #1B8A9E;
            display: inline-flex; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.25s;
            border: 1px solid rgba(27,138,158,0.25);
            font-size: 1rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .dark .toggle-btn {
            background: rgba(15,26,31,0.85);
            color: #A8DDE8;
            border-color: rgba(27,138,158,0.4);
        }
        .toggle-btn:hover {
            background: #1B8A9E; color: #FFFFFF;
            transform: rotate(10deg);
        }
        .dark .toggle-btn:hover {
            background: #A8DDE8; color: #0A2A33;
        }

        /* Card */
        .signup-card {
            background: rgba(255,255,255,0.97);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 36px;
            padding: 2.2rem 2rem 2rem;
            box-shadow: 0 20px 60px rgba(27,138,158,0.12);
            border: 1px solid rgba(27,138,158,0.15);
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }
        .dark .signup-card {
            background: rgba(15,26,31,0.95);
            border-color: rgba(27,138,158,0.3);
            box-shadow: 0 25px 60px rgba(0,0,0,0.55);
        }

        /* Inputs */
        .signup-input {
            width: 100%;
            padding: 0.85rem 1.2rem 0.85rem 3rem;
            border-radius: 50px;
            border: 1.5px solid #DFECF0;
            background: white;
            font-size: 0.95rem;
            transition: all 0.2s;
            color: #0A2A33;
            font-family: 'Inter', sans-serif;
            box-sizing: border-box;
        }
        .dark .signup-input {
            background: rgba(15,26,31,0.7);
            border-color: #1A2A30;
            color: #F0F9FC;
        }
        .signup-input::placeholder { color: #94A3B8; }
        .dark .signup-input::placeholder { color: #64748B; }
        .signup-input:focus {
            outline: none;
            border-color: #1B8A9E;
            box-shadow: 0 0 0 4px rgba(27,138,158,0.15);
        }
        .dark .signup-input:focus {
            border-color: #A8DDE8;
            box-shadow: 0 0 0 4px rgba(168,221,232,0.15);
        }

        /* password wrapper */
        .password-wrapper { position: relative; width: 100%; }
        .password-wrapper .signup-input { padding-right: 3rem; }
        .toggle-password {
            position: absolute;
            right: 1rem; top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #1B8A9E;
            font-size: 1rem;
            background: transparent;
            border: none;
            z-index: 5;
            display: flex; align-items: center; justify-content: center;
            padding: 4px;
        }
        .dark .toggle-password { color: #A8DDE8; }
        .toggle-password:hover { color: #0F6B7A; }
        .dark .toggle-password:hover { color: #D4F0F7; }
        [dir="rtl"] .toggle-password { right: auto; left: 1rem; }
        [dir="rtl"] .password-wrapper .signup-input { padding-right: 1.2rem; padding-left: 3rem; }
        [dir="rtl"] .input-icon { left: auto; right: 0; padding-left: 0; padding-right: 1rem; }

        /* primary button */
        .btn-primary {
            background: linear-gradient(135deg, #1B8A9E 0%, #0F6B7A 100%);
            color: #fff;
            font-weight: 700;
            padding: 0.9rem 1.8rem;
            border-radius: 50px;
            transition: all 0.3s ease;
            display: inline-flex; align-items: center; justify-content: center;
            width: 100%;
            font-size: 1rem;
            border: none;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            letter-spacing: 0.02em;
            gap: 0.5rem;
            position: relative;
            overflow: hidden;
        }
        .btn-primary::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.6s ease;
        }
        .btn-primary:hover::before { left: 100%; }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(27,138,158,0.4);
        }

        /* social */
        .social-btn {
            flex: 1;
            padding: 0.8rem 0.5rem;
            border-radius: 50px;
            border: 1.5px solid #DFECF0;
            background: white;
            color: #0A2A33;
            font-weight: 500;
            font-size: 0.9rem;
            display: inline-flex; align-items: center; justify-content: center;
            transition: all 0.25s ease;
            gap: 0.5rem;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
        }
        .dark .social-btn {
            background: rgba(15,26,31,0.5);
            border-color: #1A2A30;
            color: #F0F9FC;
        }
        .social-btn:hover {
            background: rgba(27,138,158,0.06);
            border-color: #1B8A9E;
            transform: translateY(-2px);
        }
        .dark .social-btn:hover {
            background: rgba(27,138,158,0.15);
            border-color: #A8DDE8;
        }
        .social-btn i { color: #1B8A9E; font-size: 1.05rem; }
        .dark .social-btn i { color: #A8DDE8; }

        /* logo */
        .logo-center {
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            margin-bottom: 1.5rem;
        }
        .logo-wrapper {
            display: flex; align-items: center; gap: 0.75rem;
            text-decoration: none;
        }
        .logo-icon-box {
            background: linear-gradient(135deg, #1B8A9E, #0F6B7A);
            width: 50px; height: 50px;
            border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 6px 16px rgba(27,138,158,0.3);
            flex-shrink: 0;
        }
        .logo-icon-box i {
            color: #FFFFFF;
            font-size: 1.4rem;
            transition: transform 0.3s ease;
        }
        .logo-wrapper:hover .logo-icon-box i { transform: scale(1.1) rotate(-4deg); }
        .logo-text-group {
            display: flex; flex-direction: column; line-height: 1.1;
        }
        .logo-text {
            font-size: 1.55rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            font-family: 'Inter', sans-serif;
        }
        .logo-text .aqua { color: #0A2A33; }
        .dark .logo-text .aqua { color: #F0F9FC; }
        .logo-text .pure { color: #1B8A9E; }
        .dark .logo-text .pure { color: #A8DDE8; }
        .logo-sub {
            font-size: 0.58rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: #7C949A;
            font-weight: 600;
            margin-top: 1px;
            display: block;
            font-family: 'Space Mono', monospace;
        }
        .dark .logo-sub { color: #A8C0C8; }

        .welcome-title {
            font-family: 'Poppins', sans-serif;
            font-size: 1.6rem;
            font-weight: 700;
            color: #0A2A33;
            margin-top: 0.5rem;
            margin-bottom: 0.05rem;
            text-align: center;
            line-height: 1.2;
        }
        .dark .welcome-title { color: #F0F9FC; }
        .welcome-subtitle {
            font-size: 0.85rem;
            color: #4B6A72;
            text-align: center;
            margin-bottom: 0.3rem;
            font-family: 'Inter', sans-serif;
        }
        .dark .welcome-subtitle { color: #A8C0C8; }

        .terms-text {
            font-size: 0.7rem;
            color: #4B6A72;
            line-height: 1.4;
        }
        .dark .terms-text { color: #A8C0C8; }
        .terms-link {
            color: #1B8A9E;
            font-weight: 600;
            text-decoration: none;
        }
        .terms-link:hover { text-decoration: underline; color: #0F6B7A; }
        .dark .terms-link { color: #A8DDE8; }
        .dark .terms-link:hover { color: #D4F0F7; }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 0.9rem 0 0.7rem;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #DFECF0;
        }
        .dark .divider::before, .dark .divider::after {
            border-bottom-color: #1A2A30;
        }
        .divider span {
            font-size: 0.7rem;
            padding: 0 0.8rem;
            color: #4B6A72;
            font-weight: 500;
            font-family: 'Space Mono', monospace;
        }
        .dark .divider span { color: #A8C0C8; }

        .container-tight { max-width: 520px; width: 100%; padding: 0; }
        .hidden { display: none; }
        .space-y-3 > :not([hidden]) ~ :not([hidden]) { margin-top: 0.6rem; }

        /* RTL */
        [dir="rtl"] .signup-input { padding: 0.85rem 3rem 0.85rem 1.2rem; }
        [dir="rtl"] .fa-arrow-right { transform: scaleX(-1); }

        /* responsive */
        @media (max-width: 430px) {
            .signup-card { padding: 1.5rem 1.2rem; border-radius: 28px; }
            .logo-icon-box { width: 42px; height: 42px; border-radius: 12px; }
            .logo-icon-box i { font-size: 1.2rem; }
            .logo-text { font-size: 1.3rem; }
            .welcome-title { font-size: 1.3rem; margin-top: 0.25rem; }
            .signup-input { padding: 0.65rem 0.9rem 0.65rem 2.6rem; font-size: 0.85rem; }
            .password-wrapper .signup-input { padding-right: 2.6rem; }
            .btn-primary { padding: 0.7rem 1rem; font-size: 0.9rem; }
            .social-btn { padding: 0.6rem 0.4rem; font-size: 0.8rem; }
            .theme-toggle-wrapper { top: 8px; right: 8px; }
            .toggle-btn { width: 34px; height: 34px; font-size: 0.85rem; }
        }
        @media (max-height: 800px) {
            .signup-card { padding: 1.4rem 1.6rem; }
            .logo-center { margin-bottom: 0.75rem; }
            .logo-icon-box { width: 42px; height: 42px; border-radius: 12px; }
            .logo-icon-box i { font-size: 1.2rem; }
            .logo-text { font-size: 1.3rem; }
            .welcome-title { font-size: 1.3rem; margin-top: 0.1rem; }
            .welcome-subtitle { font-size: 0.75rem; }
            .signup-input { padding: 0.6rem 0.9rem 0.6rem 2.6rem; font-size: 0.85rem; }
            .password-wrapper .signup-input { padding-right: 2.6rem; }
            .btn-primary { padding: 0.65rem 1rem; font-size: 0.9rem; }
            .social-btn { padding: 0.55rem 0.4rem; font-size: 0.8rem; }
            .space-y-3 > :not([hidden]) ~ :not([hidden]) { margin-top: 0.5rem; }
        }
        @media (max-height: 700px) {
            .signup-card { padding: 1rem 1.2rem; border-radius: 24px; }
            .logo-icon-box { width: 36px; height: 36px; border-radius: 10px; }
            .logo-icon-box i { font-size: 1rem; }
            .logo-text { font-size: 1.15rem; }
            .logo-sub { display: none; }
            .welcome-title { font-size: 1.1rem; margin-top: 0; }
            .welcome-subtitle { display: none; }
            .signup-input { padding: 0.5rem 0.7rem 0.5rem 2.3rem; font-size: 0.8rem; }
            .btn-primary { padding: 0.55rem 0.8rem; font-size: 0.85rem; }
            .social-btn { padding: 0.45rem 0.3rem; font-size: 0.75rem; }
            .space-y-3 > :not([hidden]) ~ :not([hidden]) { margin-top: 0.4rem; }
            .divider { margin: 0.5rem 0; }
        }
    </style>
</head>

<body>

    <!-- Floating bubbles -->
    <div class="bubble" style="width: 80px; height: 80px; top: 12%; left: 8%; animation-delay: 0s;"></div>
    <div class="bubble" style="width: 40px; height: 40px; top: 22%; left: 15%; animation-delay: 1.5s;"></div>
    <div class="bubble" style="width: 60px; height: 60px; bottom: 15%; right: 10%; animation-delay: 0.8s;"></div>
    <div class="bubble" style="width: 30px; height: 30px; bottom: 25%; right: 18%; animation-delay: 2s;"></div>
    <div class="bubble" style="width: 100px; height: 100px; top: 60%; left: 5%; animation-delay: 1s; opacity: 0.5;"></div>

    <!-- ===== THEME TOGGLES ===== -->
    <div class="theme-toggle-wrapper flex items-center gap-3">
        <button id="theme-toggle" class="toggle-btn" title="Toggle Theme" aria-label="Toggle Theme">
            <i class="fas fa-moon text-sm"></i>
            <i class="fas fa-sun text-sm hidden"></i>
        </button>
        <button id="rtl-toggle" class="toggle-btn" title="Toggle RTL" aria-label="Toggle RTL">
            <i class="fas fa-exchange-alt text-sm"></i>
        </button>
    </div>

    <!-- ===== SIGNUP CARD ===== -->
    <div class="container-tight">
        <div class="signup-card animate-fade-in">

            <!-- LOGO -->
            <div class="logo-center mb-6">
                <a href="index.html" class="logo-wrapper">
                    <div class="logo-icon-box">
                        <i class="fas fa-droplet"></i>
                    </div>
                    <div class="logo-text-group">
                        <span class="logo-text">
                            <span class="aqua">Aqua</span><span class="pure">Pure</span>
                        </span>
                        <span class="logo-sub">Pure Water Solutions</span>
                    </div>
                </a>
                <h1 class="welcome-title">Start Your Journey</h1>
                <p class="welcome-subtitle">Create your account and enjoy pure, soft water</p>
            </div>

            <!-- FORM -->
            <form id="signupForm" class="space-y-3" action="#" method="GET" novalidate>

                <!-- full name -->
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-[#1B8A9E] dark:text-[#A8DDE8] input-icon">
                        <i class="fas fa-user w-4 text-sm"></i>
                    </span>
                    <input type="text" id="fullName" name="name" placeholder="Full name" required
                        autocomplete="name"
                        class="signup-input text-sm md:text-sm">
                </div>

                <!-- address (replaces organization) -->
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-[#1B8A9E] dark:text-[#A8DDE8] input-icon">
                        <i class="fas fa-house w-4 text-sm"></i>
                    </span>
                    <input type="text" id="address" name="address" placeholder="Home address (for installation)"
                        autocomplete="street-address"
                        class="signup-input text-sm md:text-sm">
                </div>

                <!-- email -->
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-[#1B8A9E] dark:text-[#A8DDE8] input-icon">
                        <i class="fas fa-envelope w-4 text-sm"></i>
                    </span>
                    <input type="email" id="email" name="email" placeholder="Email address" required
                        autocomplete="email"
                        class="signup-input text-sm md:text-sm">
                </div>

                <!-- password -->
                <div class="password-wrapper">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-[#1B8A9E] dark:text-[#A8DDE8] input-icon">
                        <i class="fas fa-lock w-4 text-sm"></i>
                    </span>
                    <input type="password" id="signup-password" name="password" placeholder="Password (min. 6 chars)" required
                        autocomplete="new-password"
                        class="signup-input text-sm md:text-sm">
                    <button type="button" class="toggle-password" data-target="signup-password" aria-label="Show password">
                        <i class="far fa-eye-slash"></i>
                    </button>
                </div>

                <!-- confirm password -->
                <div class="password-wrapper">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-[#1B8A9E] dark:text-[#A8DDE8] input-icon">
                        <i class="fas fa-lock w-4 text-sm"></i>
                    </span>
                    <input type="password" id="signup-confirm-password" name="confirm_password" placeholder="Confirm password" required
                        autocomplete="new-password"
                        class="signup-input text-sm md:text-sm">
                    <button type="button" class="toggle-password" data-target="signup-confirm-password" aria-label="Show password">
                        <i class="far fa-eye-slash"></i>
                    </button>
                </div>

                <!-- terms -->
                <div class="flex items-start space-x-2 rtl:space-x-reverse mt-1">
                    <input type="checkbox" id="terms" required
                        class="mt-0.5 rounded border-gray-300 dark:border-gray-600 text-[#1B8A9E] focus:ring-[#1B8A9E]/30 dark:bg-gray-700">
                    <label for="terms" class="terms-text">
                        I agree to the <a href="#" class="terms-link" id="termsLink">Terms of Service</a> and <a href="#" class="terms-link" id="privacyLink">Privacy Policy</a>
                    </label>
                </div>

                <!-- submit -->
                <button type="submit" class="btn-primary mt-2">
                    Create Account <i class="fas fa-arrow-right ml-2 text-xs"></i>
                </button>
            </form>

            <!-- divider -->
            <div class="divider">
                <span>or sign up with</span>
            </div>

            <!-- social -->
            <div class="flex gap-3">
                <button type="button" class="social-btn" id="googleSignupBtn" aria-label="Sign up with Google">
                    <i class="fab fa-google"></i> <span>Google</span>
                </button>
                <button type="button" class="social-btn" id="facebookSignupBtn" aria-label="Sign up with Facebook">
                    <i class="fab fa-facebook-f"></i> <span>Facebook</span>
                </button>
            </div>

            <!-- login link -->
            <div class="mt-4 text-center">
                <span class="text-xs text-gray-600 dark:text-gray-400">Already have an account?</span>
                <a href="login.html" class="text-xs font-semibold text-[#1B8A9E] dark:text-[#A8DDE8] hover:text-[#0F6B7A] dark:hover:text-[#D4F0F7] ml-1 rtl:mr-1 hover:underline">
                    Sign in
                </a>
            </div>

        </div>
    </div>

    <!-- ===== SCRIPTS ===== -->
    <script>
        (function () {
            // ---------- THEME ----------
            const themeToggle = document.getElementById('theme-toggle');
            function setTheme(isDark) {
                if (isDark) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
                const moonIcon = themeToggle?.querySelector('.fa-moon');
                const sunIcon = themeToggle?.querySelector('.fa-sun');
                if (moonIcon && sunIcon) {
                    if (isDark) {
                        moonIcon.classList.add('hidden');
                        sunIcon.classList.remove('hidden');
                    } else {
                        moonIcon.classList.remove('hidden');
                        sunIcon.classList.add('hidden');
                    }
                }
                localStorage.setItem('theme', isDark ? 'dark' : 'light');
            }
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark') setTheme(true);
            else if (savedTheme === 'light') setTheme(false);
            else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) setTheme(true);
            else setTheme(false);

            if (themeToggle) {
                themeToggle.addEventListener('click', (e) => {
                    e.preventDefault();
                    setTheme(!document.documentElement.classList.contains('dark'));
                });
            }

            // ---------- RTL ----------
            const rtlBtn = document.getElementById('rtl-toggle');
            function setRTL(isRTL) {
                if (isRTL) {
                    document.documentElement.dir = 'rtl';
                    document.documentElement.lang = 'ar';
                    localStorage.setItem('dir', 'rtl');
                } else {
                    document.documentElement.dir = 'ltr';
                    document.documentElement.lang = 'en';
                    localStorage.setItem('dir', 'ltr');
                }
            }
            const savedDir = localStorage.getItem('dir');
            savedDir === 'rtl' ? setRTL(true) : setRTL(false);
            if (rtlBtn) {
                rtlBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    setRTL(document.documentElement.dir !== 'rtl');
                });
            }

            // ---------- PASSWORD EYE ----------
            document.querySelectorAll('.toggle-password').forEach(button => {
                button.addEventListener('click', function (e) {
                    e.preventDefault();
                    const targetId = this.getAttribute('data-target');
                    const input = document.getElementById(targetId);
                    if (input) {
                        const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
                        input.setAttribute('type', type);
                        const icon = this.querySelector('i');
                        if (icon) {
                            if (type === 'text') {
                                icon.classList.remove('fa-eye-slash');
                                icon.classList.add('fa-eye');
                            } else {
                                icon.classList.remove('fa-eye');
                                icon.classList.add('fa-eye-slash');
                            }
                        }
                    }
                });
            });

            // ---------- TOAST ----------
            function showToast(msg, type = 'info') {
                const existing = document.getElementById('simple-toast');
                if (existing) existing.remove();

                const toast = document.createElement('div');
                toast.id = 'simple-toast';
                let bg = 'linear-gradient(135deg, #1B8A9E, #0F6B7A)';
                if (type === 'error') bg = 'linear-gradient(135deg, #DC2626, #B91C1C)';
                if (type === 'warning') bg = 'linear-gradient(135deg, #D97706, #B45309)';
                if (type === 'success') bg = 'linear-gradient(135deg, #1B8A9E, #0F6B7A)';

                toast.style.cssText = `
                    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
                    background: ${bg}; color: white; padding: 0.75rem 1.25rem;
                    border-radius: 9999px; font-size: 0.875rem; font-weight: 500;
                    box-shadow: 0 12px 30px rgba(27,138,158,0.35); z-index: 9999;
                    opacity: 0; transition: opacity 0.3s ease;
                    max-width: 90vw; text-align: center;
                    font-family: 'Inter', sans-serif;
                `;
                toast.textContent = msg;
                document.body.appendChild(toast);
                requestAnimationFrame(() => { toast.style.opacity = '1'; });
                setTimeout(() => {
                    toast.style.opacity = '0';
                    setTimeout(() => toast.remove(), 350);
                }, 2600);
            }

            // ---------- SOCIAL ----------
            document.getElementById('googleSignupBtn')?.addEventListener('click', (e) => {
                e.preventDefault();
                showToast('Google sign-up coming soon. Use email to get started.', 'info');
            });
            document.getElementById('facebookSignupBtn')?.addEventListener('click', (e) => {
                e.preventDefault();
                showToast('Facebook sign-up coming soon. Use email to get started.', 'info');
            });

            // ---------- TERMS ----------
            document.getElementById('termsLink')?.addEventListener('click', (e) => {
                e.preventDefault();
                showToast('AquaPure Terms of Service would be displayed here.', 'info');
            });
            document.getElementById('privacyLink')?.addEventListener('click', (e) => {
                e.preventDefault();
                showToast('AquaPure Privacy Policy would be displayed here.', 'info');
            });

            // ---------- FORM SUBMIT ----------
            document.getElementById('signupForm')?.addEventListener('submit', function (e) {
                e.preventDefault();
                const fullName = document.getElementById('fullName')?.value.trim();
                const email = document.getElementById('email')?.value.trim();
                const password = document.getElementById('signup-password')?.value;
                const confirm = document.getElementById('signup-confirm-password')?.value;
                const termsCheck = document.getElementById('terms');

                if (!fullName || fullName.length < 2) {
                    showToast('Please enter your full name', 'warning');
                    return;
                }

                const emailPattern = /^[^\s@]+@([^\s@]+\.)+[^\s@]+$/;
                if (!emailPattern.test(email)) {
                    showToast('Please enter a valid email address', 'error');
                    return;
                }

                if (!password || password.length < 6) {
                    showToast('Password must be at least 6 characters', 'warning');
                    return;
                }

                if (password !== confirm) {
                    showToast('Passwords do not match. Please re-enter.', 'error');
                    return;
                }

                if (!termsCheck.checked) {
                    showToast('Please accept the Terms of Service and Privacy Policy.', 'warning');
                    return;
                }

                const firstName = fullName.split(' ')[0];
                showToast(`Welcome to AquaPure, ${firstName}! Your account is ready.`, 'success');
                // Uncomment to redirect:
                // setTimeout(() => { window.location.href = 'login.html'; }, 1200);
            });
        })();
    </script>
</body>
</html>
