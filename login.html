<!DOCTYPE html>
<html lang="en" dir="ltr" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Sign In · AquaPure &middot; Water Softener &amp; Filtration Systems</title>
  <link rel="icon" href="assets/images/favicon.png" type="image/png">
  <meta name="description" content="Sign in to your AquaPure account. Manage water softener installations, filtration systems, and book water testing services.">

  <script src="tailwind.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            'aqua': '#1B8A9E',
            'aqua-dark': '#0F6B7A',
            'aqua-light': '#A8DDE8',
            'aqua-glow': '#D4F0F7',
            'mist': '#F0F9FC',
            'canvas-light': '#F5FBFD',
            'canvas-dark': '#0F1A1F',
            'deep': '#0A2A33',
          },
          fontFamily: {
            'sans': ['Inter', 'system-ui', 'sans-serif'],
            'display': ['Poppins', 'sans-serif'],
            'mono': ['Space Mono', 'monospace'],
          },
          animation: {
            'fade-in': 'fadeIn 0.5s ease-out',
            'float': 'float 6s ease-in-out infinite',
            'ripple': 'ripple 2s ease-out infinite',
          },
          keyframes: {
            fadeIn: { '0%': { opacity: '0', transform: 'translateY(12px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
            float: { '0%, 100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-10px)' } },
            ripple: { '0%': { transform: 'scale(1)', opacity: '0.4' }, '100%': { transform: 'scale(2.5)', opacity: '0' } },
          }
        }
      }
    }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <style>
    html, body { min-height: 100%; margin: 0; padding: 0; }
    body {
      background-color: #F5FBFD;
      color: #0A2A33;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      font-family: 'Inter', sans-serif;
      background-image:
        radial-gradient(circle at 15% 20%, rgba(27,138,158,0.12) 0%, transparent 55%),
        radial-gradient(circle at 85% 80%, rgba(168,221,232,0.20) 0%, transparent 55%),
        linear-gradient(135deg, #F5FBFD 0%, #E8F4F8 50%, #D4EDF5 100%);
      padding: 1rem;
      box-sizing: border-box;
    }
    .dark body {
      background-color: #071012;
      color: #F0F9FC;
      background-image:
        radial-gradient(circle at 15% 20%, rgba(27,138,158,0.18) 0%, transparent 55%),
        radial-gradient(circle at 85% 80%, rgba(168,221,232,0.10) 0%, transparent 55%),
        linear-gradient(135deg, #0F1A1F 0%, #0A1418 50%, #071012 100%);
    }

    /* Floating bubbles decoration */
    .bubble {
      position: fixed;
      border-radius: 9999px;
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.6), rgba(168,221,232,0.15));
      border: 1px solid rgba(27,138,158,0.2);
      pointer-events: none;
      animation: float 8s ease-in-out infinite;
      z-index: 0;
    }
    .dark .bubble {
      background: radial-gradient(circle at 30% 30%, rgba(168,221,232,0.15), rgba(27,138,158,0.05));
      border-color: rgba(27,138,158,0.3);
    }

    /* Theme toggles */
    .theme-toggle-wrapper {
      position: fixed; top: 16px; right: 16px; z-index: 1000;
      display: flex; gap: 8px;
    }
    [dir="rtl"] .theme-toggle-wrapper { right: auto; left: 16px; }
    .toggle-btn {
      width: 40px; height: 40px;
      border-radius: 40px;
      background: rgba(255,255,255,0.9);
      color: #1B8A9E;
      display: inline-flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.25s;
      border: 1px solid rgba(27,138,158,0.25);
      font-size: 1rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .dark .toggle-btn {
      background: rgba(15,26,31,0.85);
      color: #A8DDE8;
      border-color: rgba(27,138,158,0.4);
    }
    .toggle-btn:hover {
      background: #1B8A9E; color: #FFFFFF;
      transform: rotate(10deg);
    }
    .dark .toggle-btn:hover {
      background: #A8DDE8; color: #0A2A33;
    }

    /* Login Card */
    .login-card {
      background: rgba(255,255,255,0.97);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 36px;
      padding: 2.2rem 2rem 2rem;
      box-shadow: 0 20px 60px rgba(27,138,158,0.12);
      border: 1px solid rgba(27,138,158,0.15);
      width: 100%;
      max-width: 460px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }
    .dark .login-card {
      background: rgba(15,26,31,0.95);
      border-color: rgba(27,138,158,0.3);
      box-shadow: 0 25px 60px rgba(0,0,0,0.55);
    }

    /* Inputs */
    .login-input {
      width: 100%;
      padding: 0.85rem 1.2rem 0.85rem 3rem;
      border-radius: 50px;
      border: 1.5px solid #DFECF0;
      background: white;
      font-size: 0.95rem;
      transition: all 0.2s;
      color: #0A2A33;
      font-family: 'Inter', sans-serif;
      box-sizing: border-box;
    }
    .dark .login-input {
      background: rgba(15,26,31,0.7);
      border-color: #1A2A30;
      color: #F0F9FC;
    }
    .login-input::placeholder { color: #94A3B8; }
    .dark .login-input::placeholder { color: #64748B; }
    .login-input:focus {
      outline: none;
      border-color: #1B8A9E;
      box-shadow: 0 0 0 4px rgba(27,138,158,0.15);
    }
    .dark .login-input:focus {
      border-color: #A8DDE8;
      box-shadow: 0 0 0 4px rgba(168,221,232,0.15);
    }

    /* Password wrapper */
    .password-wrapper { position: relative; width: 100%; }
    .password-wrapper .login-input { padding-right: 3rem; }
    .toggle-password {
      position: absolute;
      right: 1rem; top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      color: #1B8A9E;
      font-size: 1rem;
      background: transparent;
      border: none;
      z-index: 5;
      display: flex; align-items: center; justify-content: center;
      padding: 4px;
    }
    .dark .toggle-password { color: #A8DDE8; }
    .toggle-password:hover { color: #0F6B7A; }
    .dark .toggle-password:hover { color: #D4F0F7; }
    [dir="rtl"] .toggle-password { right: auto; left: 1rem; }
    [dir="rtl"] .password-wrapper .login-input { padding-right: 1.2rem; padding-left: 3rem; }
    [dir="rtl"] .input-icon { left: auto; right: 0; padding-left: 0; padding-right: 1rem; }

    /* Primary button */
    .btn-primary {
      background: linear-gradient(135deg, #1B8A9E 0%, #0F6B7A 100%);
      color: #fff;
      font-weight: 700;
      padding: 0.9rem 1.8rem;
      border-radius: 50px;
      transition: all 0.3s ease;
      display: inline-flex; align-items: center; justify-content: center;
      width: 100%;
      font-size: 1rem;
      border: none;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      letter-spacing: 0.02em;
      gap: 0.5rem;
      position: relative;
      overflow: hidden;
    }
    .btn-primary::before {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
      transition: left 0.6s ease;
    }
    .btn-primary:hover::before { left: 100%; }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(27,138,158,0.4);
    }

    /* Social buttons */
    .social-btn {
      flex: 1;
      padding: 0.8rem 0.5rem;
      border-radius: 50px;
      border: 1.5px solid #DFECF0;
      background: white;
      color: #0A2A33;
      font-weight: 500;
      font-size: 0.9rem;
      display: inline-flex; align-items: center; justify-content: center;
      transition: all 0.25s ease;
      gap: 0.5rem;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
    }
    .dark .social-btn {
      background: rgba(15,26,31,0.5);
      border-color: #1A2A30;
      color: #F0F9FC;
    }
    .social-btn:hover {
      background: rgba(27,138,158,0.06);
      border-color: #1B8A9E;
      transform: translateY(-2px);
    }
    .dark .social-btn:hover {
      background: rgba(27,138,158,0.15);
      border-color: #A8DDE8;
    }
    .social-btn i { color: #1B8A9E; font-size: 1.05rem; }
    .dark .social-btn i { color: #A8DDE8; }

    /* Logo */
    .logo-center {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      margin-bottom: 1.5rem;
    }
    .logo-wrapper {
      display: flex; align-items: center; gap: 0.75rem;
      text-decoration: none;
    }
    .logo-icon-box {
      background: linear-gradient(135deg, #1B8A9E, #0F6B7A);
      width: 50px; height: 50px;
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 6px 16px rgba(27,138,158,0.3);
      flex-shrink: 0;
    }
    .logo-icon-box i {
      color: #FFFFFF;
      font-size: 1.4rem;
      transition: transform 0.3s ease;
    }
    .logo-wrapper:hover .logo-icon-box i { transform: scale(1.1) rotate(-4deg); }
    .logo-text-group {
      display: flex; flex-direction: column; line-height: 1.1;
    }
    .logo-text {
      font-size: 1.55rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      font-family: 'Inter', sans-serif;
    }
    .logo-text .aqua { color: #0A2A33; }
    .dark .logo-text .aqua { color: #F0F9FC; }
    .logo-text .pure { color: #1B8A9E; }
    .dark .logo-text .pure { color: #A8DDE8; }
    .logo-sub {
      font-size: 0.58rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #7C949A;
      font-weight: 600;
      margin-top: 1px;
      display: block;
      font-family: 'Space Mono', monospace;
    }
    .dark .logo-sub { color: #A8C0C8; }

    .welcome-title {
      font-family: 'Poppins', sans-serif;
      font-size: 1.7rem;
      font-weight: 700;
      color: #0A2A33;
      margin-top: 0.5rem;
      margin-bottom: 0.25rem;
      text-align: center;
      line-height: 1.2;
    }
    .dark .welcome-title { color: #F0F9FC; }
    .welcome-subtitle {
      font-size: 0.9rem;
      color: #4B6A72;
      text-align: center;
      margin-bottom: 0.5rem;
      font-family: 'Inter', sans-serif;
    }
    .dark .welcome-subtitle { color: #A8C0C8; }

    /* RTL */
    [dir="rtl"] .login-input { padding: 0.85rem 3rem 0.85rem 1.2rem; }
    [dir="rtl"] .fa-arrow-right { transform: scaleX(-1); }

    /* Responsive */
    @media (max-height: 700px) {
      .login-card { padding: 1.4rem 1.6rem; }
      .logo-center { margin-bottom: 0.75rem; }
      .welcome-title { font-size: 1.4rem; margin-top: 0; }
      .welcome-subtitle { font-size: 0.8rem; margin-bottom: 0.5rem; }
      .login-input { padding: 0.65rem 1rem 0.65rem 2.6rem; font-size: 0.9rem; }
      .password-wrapper .login-input { padding-right: 2.6rem; }
      .btn-primary { padding: 0.7rem 1rem; font-size: 0.95rem; margin-top: 0.15rem; }
      .social-btn { padding: 0.6rem 0.5rem; font-size: 0.85rem; }
      .theme-toggle-wrapper { top: 8px; right: 8px; }
      .toggle-btn { width: 34px; height: 34px; font-size: 0.85rem; }
    }
    @media (max-height: 620px) {
      .login-card { padding: 1rem 1.2rem; border-radius: 24px; }
      .logo-icon-box { width: 42px; height: 42px; border-radius: 12px; }
      .logo-icon-box i { font-size: 1.1rem; }
      .logo-text { font-size: 1.3rem; }
      .logo-sub { display: none; }
      .welcome-title { font-size: 1.2rem; }
      .welcome-subtitle { display: none; }
      form.space-y-4 > * + * { margin-top: 0.55rem !important; }
    }
    @media (max-width: 380px) {
      .login-card { padding: 1.5rem 1.2rem; border-radius: 24px; }
      .welcome-title { font-size: 1.35rem; }
      .login-input { padding: 0.7rem 1rem 0.7rem 2.6rem; font-size: 0.85rem; }
      .social-btn span { font-size: 0.8rem; }
    }
    .container-tight { max-width: 500px; width: 100%; padding: 0; }
    a { transition: all 0.2s ease; }
    .hidden { display: none; }
  </style>
</head>

<body>

  <!-- Decorative floating bubbles -->
  <div class="bubble" style="width: 80px; height: 80px; top: 12%; left: 8%; animation-delay: 0s;"></div>
  <div class="bubble" style="width: 40px; height: 40px; top: 22%; left: 15%; animation-delay: 1.5s;"></div>
  <div class="bubble" style="width: 60px; height: 60px; bottom: 15%; right: 10%; animation-delay: 0.8s;"></div>
  <div class="bubble" style="width: 30px; height: 30px; bottom: 25%; right: 18%; animation-delay: 2s;"></div>
  <div class="bubble" style="width: 100px; height: 100px; top: 60%; left: 5%; animation-delay: 1s; opacity: 0.5;"></div>

  <!-- ===== THEME TOGGLES ===== -->
  <div class="theme-toggle-wrapper flex items-center gap-3">
    <button id="theme-toggle" class="toggle-btn" title="Toggle Theme" aria-label="Toggle Theme">
      <i class="fas fa-moon text-sm"></i>
      <i class="fas fa-sun text-sm hidden"></i>
    </button>
    <button id="rtl-toggle" class="toggle-btn" title="Toggle RTL" aria-label="Toggle RTL">
      <i class="fas fa-exchange-alt text-sm"></i>
    </button>
  </div>

  <!-- ===== LOGIN CARD ===== -->
  <div class="container-tight">
    <div class="login-card animate-fade-in">

      <!-- LOGO -->
      <div class="logo-center mb-6">
        <a href="index.html" class="logo-wrapper">
          <div class="logo-icon-box">
            <i class="fas fa-droplet"></i>
          </div>
          <div class="logo-text-group">
            <span class="logo-text">
              <span class="aqua">Aqua</span><span class="pure">Pure</span>
            </span>
            <span class="logo-sub">Pure Water Solutions</span>
          </div>
        </a>
        <h1 class="welcome-title mt-4">Welcome Back</h1>
        <p class="welcome-subtitle">Sign in to manage your water systems &amp; services</p>
      </div>

      <!-- LOGIN FORM -->
      <form id="loginForm" class="space-y-4" action="#" method="GET" novalidate>

        <!-- Email -->
        <div class="relative">
          <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-[#1B8A9E] dark:text-[#A8DDE8] input-icon">
            <i class="fas fa-envelope w-5 text-sm"></i>
          </span>
          <input type="email" name="email" id="login-email" placeholder="Email address" required
            autocomplete="email"
            class="login-input text-sm md:text-base">
        </div>

        <!-- Password -->
        <div class="password-wrapper">
          <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-[#1B8A9E] dark:text-[#A8DDE8] input-icon">
            <i class="fas fa-lock w-5 text-sm"></i>
          </span>
          <input type="password" id="login-password" name="password" placeholder="Password" required
            autocomplete="current-password"
            class="login-input text-sm md:text-base">
          <button type="button" class="toggle-password" data-target="login-password" aria-label="Show password">
            <i class="far fa-eye-slash"></i>
          </button>
        </div>

        <!-- Remember + Forgot -->
        <div class="flex items-center justify-between text-xs md:text-sm gap-2">
          <label class="flex items-center space-x-2 rtl:space-x-reverse cursor-pointer text-gray-700 dark:text-gray-300">
            <input type="checkbox" checked
              class="rounded border-gray-300 dark:border-gray-600 text-[#1B8A9E] focus:ring-[#1B8A9E]/30 dark:bg-gray-700">
            <span class="ml-1 rtl:mr-1">Remember me</span>
          </label>
          <a href="#" id="forgotPasswordLink"
            class="text-[#1B8A9E] dark:text-[#A8DDE8] hover:text-[#0F6B7A] dark:hover:text-[#D4F0F7] font-medium transition hover:underline inline-block whitespace-nowrap">
            Forgot password?
          </a>
        </div>

        <!-- Submit -->
        <button type="submit" class="btn-primary mt-2">
          <i class="fas fa-arrow-right-to-bracket text-sm"></i>
          Sign In
        </button>

      </form>

      <!-- Divider -->
      <div class="relative my-5">
        <div class="absolute inset-0 flex items-center">
          <div class="w-full border-t border-gray-200 dark:border-gray-700"></div>
        </div>
        <div class="relative justify-center flex text-xs">
          <span class="bg-white dark:bg-[#0F1A1F] px-4 py-0.5 text-gray-500 dark:text-gray-400 rounded-full font-mono">
            or continue with
          </span>
        </div>
      </div>

      <!-- Social login -->
      <div class="grid grid-cols-2 gap-3">
        <button type="button" class="social-btn" onclick="socialLogin('google')" aria-label="Continue with Google">
          <i class="fab fa-google"></i>
          <span>Google</span>
        </button>
        <button type="button" class="social-btn" onclick="socialLogin('facebook')" aria-label="Continue with Facebook">
          <i class="fab fa-facebook-f"></i>
          <span>Facebook</span>
        </button>
      </div>

      <!-- Sign up link -->
      <div class="text-center mt-5 pt-4 border-t border-dashed border-gray-200 dark:border-gray-700/40">
        <span class="text-gray-700 dark:text-gray-300 text-sm md:text-base">New to AquaPure?</span>
        <a href="register.html"
          class="inline-flex items-center text-[#1B8A9E] dark:text-[#A8DDE8] font-semibold hover:text-[#0F6B7A] dark:hover:text-[#D4F0F7] transition hover:underline text-sm md:text-base ml-1">
          Create an account
          <i class="fas fa-arrow-right ml-2 text-xs"></i>
        </a>
      </div>

      <!-- Trust badges -->
      <div class="flex items-center justify-center gap-3 mt-5 flex-wrap">
        <span class="inline-flex items-center gap-1.5 text-[10px] font-mono font-bold text-[#1B8A9E] dark:text-[#A8DDE8] bg-[#1B8A9E]/10 dark:bg-[#1B8A9E]/20 px-3 py-1 rounded-full">
          <i class="fas fa-shield-halved"></i> SSL Secured
        </span>
        <span class="inline-flex items-center gap-1.5 text-[10px] font-mono font-bold text-[#1B8A9E] dark:text-[#A8DDE8] bg-[#1B8A9E]/10 dark:bg-[#1B8A9E]/20 px-3 py-1 rounded-full">
          <i class="fas fa-certificate"></i> 5-Year Warranty
        </span>
      </div>

    </div>
  </div>

  <!-- ===== SCRIPTS ===== -->
  <script>
    (function () {
      // ---------- THEME TOGGLE ----------
      const themeToggle = document.getElementById('theme-toggle');
      function setTheme(isDark) {
        if (isDark) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
        const moonIcon = themeToggle?.querySelector('.fa-moon');
        const sunIcon = themeToggle?.querySelector('.fa-sun');
        if (moonIcon && sunIcon) {
          if (isDark) {
            moonIcon.classList.add('hidden');
            sunIcon.classList.remove('hidden');
          } else {
            moonIcon.classList.remove('hidden');
            sunIcon.classList.add('hidden');
          }
        }
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
      }
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme === 'dark') setTheme(true);
      else if (savedTheme === 'light') setTheme(false);
      else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) setTheme(true);
      else setTheme(false);

      if (themeToggle) {
        themeToggle.addEventListener('click', (e) => {
          e.preventDefault();
          setTheme(!document.documentElement.classList.contains('dark'));
        });
      }

      // ---------- RTL TOGGLE ----------
      const rtlBtn = document.getElementById('rtl-toggle');
      function setRTL(isRTL) {
        if (isRTL) {
          document.documentElement.dir = 'rtl';
          document.documentElement.lang = 'ar';
          localStorage.setItem('dir', 'rtl');
        } else {
          document.documentElement.dir = 'ltr';
          document.documentElement.lang = 'en';
          localStorage.setItem('dir', 'ltr');
        }
      }
      const savedDir = localStorage.getItem('dir');
      savedDir === 'rtl' ? setRTL(true) : setRTL(false);
      if (rtlBtn) {
        rtlBtn.addEventListener('click', (e) => {
          e.preventDefault();
          setRTL(document.documentElement.dir !== 'rtl');
        });
      }

      // ---------- PASSWORD EYE ----------
      document.querySelectorAll('.toggle-password').forEach(button => {
        button.addEventListener('click', function (e) {
          e.preventDefault();
          const targetId = this.getAttribute('data-target');
          const input = document.getElementById(targetId);
          if (input) {
            const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
            input.setAttribute('type', type);
            const icon = this.querySelector('i');
            if (icon) {
              if (type === 'text') {
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
              } else {
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
              }
            }
          }
        });
      });

      // ---------- TOAST ----------
      function showToast(msg, type = 'info') {
        const existing = document.getElementById('simple-toast');
        if (existing) existing.remove();

        const toast = document.createElement('div');
        toast.id = 'simple-toast';
        let bg = 'linear-gradient(135deg, #1B8A9E, #0F6B7A)';
        if (type === 'error') bg = 'linear-gradient(135deg, #DC2626, #B91C1C)';
        if (type === 'warning') bg = 'linear-gradient(135deg, #D97706, #B45309)';
        if (type === 'success') bg = 'linear-gradient(135deg, #1B8A9E, #0F6B7A)';

        toast.style.cssText = `
          position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
          background: ${bg}; color: white; padding: 0.75rem 1.25rem;
          border-radius: 9999px; font-size: 0.875rem; font-weight: 500;
          box-shadow: 0 12px 30px rgba(27,138,158,0.35); z-index: 9999;
          opacity: 0; transition: opacity 0.3s ease;
          max-width: 90vw; text-align: center;
          font-family: 'Inter', sans-serif;
        `;
        toast.textContent = msg;
        document.body.appendChild(toast);
        requestAnimationFrame(() => { toast.style.opacity = '1'; });
        setTimeout(() => {
          toast.style.opacity = '0';
          setTimeout(() => toast.remove(), 350);
        }, 2600);
      }

      // ---------- FORGOT PASSWORD ----------
      document.getElementById('forgotPasswordLink')?.addEventListener('click', (e) => {
        e.preventDefault();
        showToast('Password reset link will be sent to your email.', 'info');
      });

      // ---------- LOGIN SUBMIT ----------
      document.getElementById('loginForm')?.addEventListener('submit', (e) => {
        e.preventDefault();
        const email = document.getElementById('login-email')?.value.trim();
        const password = document.getElementById('login-password')?.value;

        if (!email || !password) {
          showToast('Please enter both email and password', 'warning');
          return;
        }
        const emailPattern = /^[^\s@]+@([^\s@]+\.)+[^\s@]+$/;
        if (!emailPattern.test(email)) {
          showToast('Please enter a valid email address', 'error');
          return;
        }
        if (password.length < 6) {
          showToast('Password must be at least 6 characters', 'warning');
          return;
        }

        showToast('Welcome back to AquaPure! Redirecting…', 'success');
        // Uncomment to redirect:
        // setTimeout(() => { window.location.href = 'customer.html'; }, 900);
      });

      // ---------- SOCIAL LOGIN ----------
      window.socialLogin = function (provider) {
        const name = provider.charAt(0).toUpperCase() + provider.slice(1);
        showToast(`${name} sign-in coming soon. Use email for now.`, 'info');
      };
    })();
  </script>

</body>
</html>
